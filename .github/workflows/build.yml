name: build

on:
  push:
    branches: [ main, 'v2-**', 'feature/**', 'fix/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DevPilot.sln
      - name: Build
        run: dotnet build DevPilot.sln -c Release --no-restore -warnaserror:false
      - name: Test
        run: dotnet test DevPilot.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Publish app
        if: success()
        run: dotnet publish DevPilot.UI/DevPilot.UI.csproj -c Release -r win-x64 --self-contained false -o publish/DevPilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DevPilot-win-x64
          path: publish/DevPilot
