name: build

on:
  push:
    branches: [ main, 'v2-**', 'feature/**', 'fix/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DevPilot.sln
      - name: Test
        run: dotnet test DevPilot.Tests/DevPilot.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            Select-Xml -Xml $trx -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | ForEach-Object {
              $r = $_.Node
              $msg = ($r.Output.ErrorInfo.Message -replace "`r?`n", ' | ')
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              Write-Output "::error title=$($r.testName)::$msg"
            }
          }
      - name: Build solution
        run: dotnet build DevPilot.sln -c Release --no-restore
      - name: Publish app
        run: dotnet publish DevPilot.UI/DevPilot.UI.csproj -c Release -r win-x64 --self-contained false -o publish/DevPilot
      - name: UI smoke test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'shots'
          $p = Start-Process -FilePath (Resolve-Path publish/DevPilot/DevPilot.exe) -ArgumentList '--smoke', $out -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Smoke test timed out' }
          $report = Join-Path $out 'smoke-report.txt'
          if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Output "::notice title=smoke::$_" } }
          $errors = Join-Path $out 'binding-errors.txt'
          if (Test-Path $errors) { Get-Content $errors | Select-Object -First 30 | ForEach-Object { Write-Output "::warning title=binding::$_" } }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit $($p.ExitCode))" }
      - name: Publish screenshots (ci-shots branch)
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'shots'
          if (-not (Test-Path $out)) { exit 0 }
          Set-Location $out
          Remove-Item -Recurse -Force data -ErrorAction SilentlyContinue
          Set-Content -Path SOURCE.txt -Value "${{ github.sha }}"
          git init -q
          git checkout -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "UI screenshots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: DevPilot-win-x64
          path: publish/DevPilot
